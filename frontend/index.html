<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天地图下载处理工具</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.1/ol.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <aside id="panel">
      <div class="panel-top">
        <h1>天地图下载工具</h1>
        <div id="token-warn" class="warn hidden">未检测到天地图密钥,请在 config.yaml 中填写后重启服务。</div>

        <section class="card">
          <h2>1. 选择范围</h2>
          <button id="btn-draw-rect">绘制矩形</button>
          <button id="btn-draw-poly">绘制多边形</button>
          <button id="btn-import">导入矢量</button>
          <input type="file" id="file-vector" accept=".geojson,.json,.kml,.shp,.dbf,.shx,.prj,.zip" multiple style="display:none" />
          <div style="margin-top:6px">
            <button id="btn-edit" class="ghost" disabled>编辑</button>
            <button id="btn-clear" class="ghost">清除</button>
          </div>
          <div class="hint">
            编辑模式下:拖动内部整体平移;拖动角点缩放/改形。<br>
            多边形:编辑时点击边中点可加点,右键顶点可删点(不少于 3 个)。<br>
            导入矢量:支持 GeoJSON / KML;Shapefile 请选 .zip 或同时选中 .shp/.dbf/.shx。
          </div>
          <div id="bbox-info" class="muted">尚未选择范围</div>
        </section>

        <section class="card">
          <h2>2. 下载参数</h2>
          <label>任务名称
            <input id="task-name" type="text" value="影像下载" />
          </label>
          <label>数据类型
            <select id="provider">
              <option value="tianditu_img">天地图影像</option>
              <option value="tianditu_vec">天地图矢量底图</option>
              <option value="tianditu_ter">天地图地形晕渲</option>
            </select>
          </label>
          <div class="row">
            <label>起始级别
              <input id="z-min" type="number" min="1" max="18" value="10" />
            </label>
            <label>结束级别
              <input id="z-max" type="number" min="1" max="18" value="12" />
            </label>
          </div>
          <label>导出格式
            <select id="export">
              <option value="both">GeoTIFF + TMS 瓦片</option>
              <option value="geotiff">仅带坐标 GeoTIFF</option>
              <option value="tms">仅 TMS 瓦片</option>
            </select>
          </label>
          <label>输出坐标系(GeoTIFF)
            <select id="crs"></select>
          </label>
          <label class="check-inline" id="clip-wrap" style="display:none">
            <input type="checkbox" id="clip" />
            裁剪 GeoTIFF 到矢量/多边形边界
          </label>
          <div id="estimate" class="muted">预计瓦片数:—</div>
        </section>

        <section class="card">
          <button id="btn-submit" class="primary" disabled>加入下载队列</button>
        </section>
      </div>
    </aside>

    <main id="map">
      <div id="map-info">
        <span id="info-zoom">层级:—</span>
        <span id="info-scale">比例尺:—</span>
        <span id="info-coord">经纬度:—</span>
      </div>

      <!-- 任务详情面板(点击任务时弹出于地图右上角) -->
      <div id="detail-panel" class="hidden">
        <div class="detail-head">
          <span id="detail-title">任务详情</span>
          <button id="detail-close" title="关闭">×</button>
        </div>
        <div id="detail-body"></div>
        <label class="detail-toggle">
          <input type="checkbox" id="detail-show-range" checked />
          在地图上显示下载范围
        </label>
        <button id="detail-zoom" class="ghost">缩放到范围</button>
      </div>
    </main>

    <aside id="queue-panel">
      <h1>任务队列</h1>
      <div id="task-list"></div>
    </aside>

    <!-- 源坐标系选择弹窗(导入矢量无法自动识别时) -->
    <div id="srs-modal" class="modal-mask hidden">
      <div class="modal-box">
        <h3>选择矢量源坐标系</h3>
        <p id="srs-hint" class="hint"></p>
        <select id="srs-select"></select>
        <div class="modal-actions">
          <button id="srs-cancel" class="ghost">取消</button>
          <button id="srs-ok" class="primary" style="width:auto">确定并转换</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
  <!-- 矢量解析:shpjs 解 shp/zip,togeojson 解 kml,proj4 做源坐标系转换 -->
  <script src="https://cdn.jsdelivr.net/npm/shpjs@6.1.0/dist/shp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js"></script>
  <script src="./app.js"></script>
</body>
</html>
