# 天地图下载处理工具 - 配置示例
# 复制本文件为 config.yaml 后填写自己的参数

tianditu:
  # 天地图访问密钥(必填)。申请地址:https://console.tianditu.gov.cn/api/key
  token: "f58515ae74e4e1a119554a59d424f1eb"
  # 底图显示用密钥。与下载密钥区分,分别控配额;留空则回落到 token。
  basemap_token: ""

download:
  # 单个任务的最大并发下载数
  concurrency: 8
  # 单张瓦片失败后的最大重试次数
  max_retries: 3
  # 每张瓦片请求超时(秒)
  timeout: 30
  # 瓦片缓存目录(断点续传依赖此目录)
  cache_dir: "./data/tiles"

output:
  # 成果输出根目录
  dir: "./output"

server:
  host: "127.0.0.1"
  port: 8000

buildings:
  # 三维建筑白模。默认数据源为 OSM 建筑轮廓(经 Overpass API),境内可直连。

  # Overpass 镜像列表(逗号分隔)。留空用内置默认:
  #   kumi.systems → private.coffee → overpass-api.de(主站最拥挤,放最后)
  # 公共实例负载波动大,遇持续 504 可换序或填自建实例。
  overpass_mirrors: ""
  # 范围分块跨度(度)。范围会按此尺寸切块逐块请求;
  # 城区建筑极密时可调小(如 0.02),避免单块响应过大被服务端截断。
  overpass_chunk_deg: 0.05

  # ---- 以下仅 Overture 数据源用到 ----
  # Overture 是全球融合数据(覆盖率更高),但为 AWS S3 上的 512 个 parquet 分片,
  # 做范围裁剪需读遍全部分片元数据,境内实测单次查询十几小时,基本不可用。
  # 仅在境外服务器或有高速代理时选用。
  # 发布版本。留空则自动探测最新版(S3 只保留最近约两个版本)
  release: ""
  # HTTP 代理,如 "127.0.0.1:7890"
  proxy: ""

tools:
  # 外部三维处理器路径。留空表示未配置;三维任务提交前可访问 /api/tools/diagnose 自检。
  tiles3d_exe: ""        # 例如 tools/3dtiles/3dtiles.exe
  pdal_exe: ""           # 例如 tools/pdal/bin/pdal.exe
  py3dtiles_python: ""   # 例如 tools/py3dtiles-venv/Scripts/python.exe

# worker 进程池:能同时执行的任务数。
# 单个任务内部已有瓦片级并发,默认 2 可并行跑两个任务;
# 代价是内存(每个常驻 worker 约 60MB)与磁盘 I/O 竞争 ——
# 大范围任务同时跑会加速磁盘消耗。
worker:
  num_workers: 2

google:
  # Google 影像(非官方瓦片端点)。实测直连不通,必须配代理。
  enabled: false
  # 代理地址。可写 "127.0.0.1:6789" 或带 scheme 的完整 URL,两种都行。
  # 注意:不支持 socks5(aiohttp 不内置 SOCKS 支持)。
  proxy: ""
  # 端点会变更,失效时先改这里。不设 key 字段:该端点忽略 key 参数。
  url_template: "https://mt{s}.google.com/vt/lyrs={lyrs}&x={x}&y={y}&z={z}"
  subdomains: "0,1,2,3"
  max_zoom: 21          # 实测陆地处处可用到 21;22 级仅部分地区有

esri_imagery:
  # Esri World Imagery。与现用的 Esri Terrain3D(DEM)是不同服务:
  # Terrain3D 直连可用,World Imagery 实测直连不通,必须配代理。
  enabled: false
  proxy: ""
  url_template: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
  # 服务级天花板。实测 z19 是亚欧城市上限(z20 仅美国境内有)。
  max_zoom: 19
  # 按选区探测该地区实际最高级别。实测西部无人区最高仅 z17,
  # 关掉后用户选 z18 会下到一整片灰色占位图。
  probe_max_zoom: true
  probe_cache_hours: 24
